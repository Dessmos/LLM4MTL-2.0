[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm4mtl"
version = "0.0.0"
description = "LLM4MTL experiment pipeline (v5 skeleton)"
requires-python = ">=3.11"
# jsonschema enforces schemas/ on every persisted artifact: the schemas are a
# contract shared with n8n, not documentation, so writers validate before writing.
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
dev = ["pytest>=7", "fastapi", "uvicorn", "httpx"]
service = ["fastapi", "uvicorn[standard]"]

[project.scripts]
llm4mtl = "llm4mtl.experiment_runner.cli:main"

# src layout: the importable package lives under pipeline/src/llm4mtl.
[tool.setuptools.packages.find]
where = ["src"]
include = ["llm4mtl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
