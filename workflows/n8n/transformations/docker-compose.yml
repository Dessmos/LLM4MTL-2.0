services:
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"                  # host:container
    environment:                     # optional but recommended
      - GENERIC_TIMEZONE=Europe/Berlin
      - TZ=Europe/Berlin
      - N8N_SECURE_COOKIE=false
      # - N8N_BASIC_AUTH_ACTIVE=true
      # - N8N_BASIC_AUTH_USER=admin
      # - N8N_BASIC_AUTH_PASSWORD=supersecret
    depends_on:
      - stage-service
    volumes:
      # 1️⃣ keep n8n’s internal data (workflows, creds, etc.)
      - n8n_data:/home/node/.n8n
      # Generated prompts and model responses are written only to artifacts/work.
      - "../../../artifacts/work:/data/artifacts"
      - "../../../prompt_assets/task_prompts:/data/task_prompts:ro"
      # Immutable source inputs are mounted read-only and stay outside artifacts/.
      - "./mtl_snippets:/data/snippets:ro"
      - "../../../benchmark/tasks:/data/benchmark/tasks:ro"
      - "../../../prompt_assets/transformations/few_shot:/data/examples:ro"
      - "../../../benchmark/metamodels:/data/models:ro"
      - "../../../prompt_assets/transformations/helper_methods:/data/helper_methods:ro"
      - "../../../prompt_assets/transformations/grammar:/data/grammar:ro"
      - "../../../prompt_assets/diagnosis:/data/diagnosis_prompts:ro"

  stage-service:
    build:
      context: ../../..
      dockerfile: pipeline/stage_service/Dockerfile
    volumes:
      - ../../..:/app

volumes:
  n8n_data:
