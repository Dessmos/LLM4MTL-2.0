services:
  n8n-test-generation:
    image: n8nio/n8n:latest
    container_name: n8n-test-generation
    ports:
      - "5679:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Berlin
      - TZ=Europe/Berlin
      - N8N_SECURE_COOKIE=false
      - N8N_RESTRICT_FILE_ACCESS_TO=/data
    depends_on:
      - stage-service
    volumes:
      # Keep this test-generation n8n instance separate from the baseline n8n.
      - n8n_test_generation_data:/home/node/.n8n

      # Importable workflows and generated LLM prompts/responses.
      - "./workflows:/data/workflows:ro"
      - "../../../artifacts/work:/data/artifacts"
      - "../../../prompt_assets/task_prompts:/data/task_prompts:ro"

      # Reference names enumerate tasks; the stage service resolves the matching
      # contract and exact metamodel files from its read-only repository view.
      - "../../../benchmark/tasks:/data/benchmark/tasks:ro"
      - "../../../prompt_assets/tests/few_shot:/data/examples:ro"
      - "../../../prompt_assets/tests/grammar:/data/grammar:ro"
      - "../../../prompt_assets/tests/helper_methods:/data/helper_methods:ro"
      - "../../../prompt_assets/diagnosis:/data/diagnosis_prompts:ro"

  stage-service:
    build:
      context: ../../..
      dockerfile: pipeline/stage_service/Dockerfile
    volumes:
      - ../../..:/app

volumes:
  n8n_test_generation_data:
